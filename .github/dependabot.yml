version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - internal
      - dependencies

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - dependencies

  # onig_sys vendors the oniguruma C library, so this is the one dependency tree where
  # upstream CVEs actually land in the published artifacts.
  - package-ecosystem: "cargo"
    directory: "/oniguruma-jni/native"
    schedule:
      interval: "daily"
    labels:
      - dependencies
