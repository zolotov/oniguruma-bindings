version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - internal
      - dependencies
    groups:
      # init and analyze are pinned to the same commit SHA and must be bumped
      # together, otherwise CodeQL fails with a version mismatch.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - dependencies

  - package-ecosystem: "cargo"
    directory: "/oniguruma-jni/native"
    schedule:
      interval: "daily"
    labels:
      - dependencies
