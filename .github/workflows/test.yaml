name: "Tests"

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  # Fork pull requests only ever trigger pull_request events -- without this they got no
  # test run at all. Same-repo branches are already covered by the push trigger, so the
  # job condition below skips the duplicate pull_request run for them.
  pull_request:

# Deliberately no checks: write here: this workflow runs the Gradle build, cargo build
# scripts and the tests themselves, so it should not hold a writable token while doing so.
# test-report.yaml publishes the check runs from the uploaded XML instead.
permissions:
  contents: read

# A superseded run's six matrix jobs have no value; cancel them like benchmarks.yaml does.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.85.0

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
        module: [oniguruma-jni, oniguruma-ffm]

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Rust
        if: matrix.module == 'oniguruma-jni'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache: true
          cache-workspaces: "./oniguruma-jni/native -> target"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Install Linux compilation dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Test with Gradle
        run: ./gradlew ":${{ matrix.module }}:test"

      - name: Upload test results
        if: always() # Ensure failing tests still get reported
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ matrix.module }}-${{ matrix.os }}
          path: "${{ matrix.module }}/build/test-results/test/*.xml"
