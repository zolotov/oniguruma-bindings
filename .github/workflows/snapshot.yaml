name: Snapshot

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      module:
        description: "Module to publish"
        required: true
        type: choice
        options:
          - oniguruma-jni
          - oniguruma-ffm
      version:
        description: "New version"
        required: true

run-name: "Publish ${{ inputs.module }} ${{ inputs.version }}-SNAPSHOT"

jobs:
  build-native:
    uses: ./.github/workflows/build.yaml
    with:
      module: ${{ inputs.module }}

  publish:
    runs-on: ubuntu-22.04
    needs: build-native
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download all workflow run artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ${{ inputs.module }}-*-native-artifacts
          path: ${{ inputs.module }}/build/target
          merge-multiple: true

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Publish
        env:
          NATIVE_BUILD_MODE: "skip"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_SECRET_ASCII_ARMORED }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SECRET_ASCII_ARMORED }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSWORD }}

          # Properties expected by the gradle-maven-publish-plugin
          # https://vanniktech.github.io/gradle-maven-publish-plugin/central/#__tabbed_5_2
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_TOKEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_TOKEN_PASSWORD }}
          MODULE: ${{ inputs.module }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: ./gradlew ":${MODULE}:check" ":${MODULE}:publishAllPublicationsToMavenCentralRepository" "-Pversion=${VERSION}-SNAPSHOT" --no-configuration-cache --no-isolated-projects
