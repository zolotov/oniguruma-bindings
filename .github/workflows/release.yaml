name: Release
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      module:
        description: "Module to release"
        required: true
        type: choice
        options:
          - oniguruma-jni
          - oniguruma-ffm
      version:
        description: "New version"
        required: true

run-name: "Release ${{ inputs.module }} ${{ inputs.version }}"

jobs:
  build-native:
    uses: ./.github/workflows/build.yaml
    with:
      module: ${{ inputs.module }}

  release:
    runs-on: ubuntu-22.04
    needs: build-native
    permissions:
      # Push the changelog commit and create the GitHub release
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave a contents: write credential in .git/config for the whole job.
          # The Publish step below runs arbitrary build logic and third-party Gradle
          # plugins alongside the GPG signing key and the Maven Central credentials; a
          # persisted token would be readable by any of them. The changelog push
          # authenticates explicitly instead.
          persist-credentials: false

      - name: Download all workflow run artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ${{ inputs.module }}-*-native-artifacts
          path: ${{ inputs.module }}/build/target
          merge-multiple: true

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      # Runs before publishing so a missing or unedited changelog aborts the release while it is
      # still reversible: patchChangelog fails with MissingReleaseNoteException when the
      # "Unreleased" section is empty, because the modules set patchEmpty = false.
      #
      # Nothing here generates release notes. patchChangelog only promotes the hand-written
      # "Unreleased" section to a version section, and getChangelog copies that same text out for
      # the GitHub release, so what ships is exactly what was reviewed.
      #
      # The two tasks need separate invocations: the plugin parses CHANGELOG.md once at
      # configuration time and shares that snapshot between tasks, so a getChangelog in the same
      # invocation would still see the unpatched file and fail on the missing version.
      - name: Promote the Unreleased changelog section and stamp the README
        env:
          MODULE: ${{ inputs.module }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: ./gradlew ":${MODULE}:patchChangelog" ":${MODULE}:updateReadmeVersion" "-Pversion=${VERSION}" --no-configuration-cache --no-isolated-projects

      - name: Extract the release notes
        env:
          MODULE: ${{ inputs.module }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: ./gradlew ":${MODULE}:getChangelog" "--project-version=${VERSION}" "--no-header" "--no-empty-sections" "-Pversion=${VERSION}" --no-configuration-cache --no-isolated-projects

      - name: Publish
        env:
          NATIVE_BUILD_MODE: "skip"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_SECRET_ASCII_ARMORED }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SECRET_ASCII_ARMORED }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSWORD }}

          # Properties expected by the gradle-maven-publish-plugin
          # https://vanniktech.github.io/gradle-maven-publish-plugin/central/#__tabbed_5_2
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_TOKEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_TOKEN_PASSWORD }}
          MODULE: ${{ inputs.module }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: ./gradlew ":${MODULE}:check" ":${MODULE}:publishAndReleaseToMavenCentral" "-Pversion=${VERSION}" --no-configuration-cache --no-isolated-projects

      - name: Commit and push change log
        id: changelog-commit
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${MODULE}/CHANGELOG.md" "${MODULE}/README.md"
          git commit -m "${MODULE} version ${VERSION}"
          # The checkout intentionally persists no credentials, so authenticate this one
          # push explicitly. Actions masks GITHUB_TOKEN in logs.
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${GITHUB_REF_NAME}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODULE: ${{ inputs.module }}
          VERSION: ${{ inputs.version }}

      - name: Create release and tag
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ inputs.module }}-${{ inputs.version }}
          name: "${{ inputs.module }} ${{ inputs.version }}"
          target_commitish: ${{ steps.changelog-commit.outputs.sha }}
          body_path: ${{ inputs.module }}/build/reports/changelog/latest-release-body.md
